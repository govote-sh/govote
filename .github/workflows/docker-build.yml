name: Docker Build

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker-build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Without this, fly-deploy.yml is the first and only thing that ever builds
      # the Dockerfile, so image breakage is discovered in production.
      - name: Build the deploy image
        run: docker build .
